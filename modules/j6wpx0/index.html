<style>
  /* ust-icindekiler — Menü bir kitabın içindekiler sayfası: noktalı kılavuz çizgileri ve numaralarla tüm sayfa ağacı tek tabloda — kart, çekmece ya da gazete sütunu değil, matbaa fihristi. */
  .modulex-ust-icindekiler { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-icindekiler *, .modulex-ust-icindekiler *::before, .modulex-ust-icindekiler *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-icindekiler :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-icindekiler :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-icindekiler :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-icindekiler :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-icindekiler img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-icindekiler) img { height: auto; }
  .modulex-ust-icindekiler [hidden] { display: none !important; }
  .modulex-ust-icindekiler :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-icindekiler :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-icindekiler-ic { max-width: --max--; margin-inline: auto; }

  .modulex-ust-icindekiler--bassiz .modulex-ust-icindekiler-bas { display: none; }

  .modulex-ust-icindekiler-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-icindekiler-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-icindekiler-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-ust-icindekiler { position: relative; z-index: 900; }
  .modulex-ust-icindekiler-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-icindekiler-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-icindekiler-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-icindekiler-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-icindekiler-oge:hover, .modulex-ust-icindekiler-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-icindekiler-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-icindekiler-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-icindekiler-cta .material-symbols-outlined, .modulex-ust-icindekiler-tel .material-symbols-outlined, .modulex-ust-icindekiler-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-icindekiler-tel, .modulex-ust-icindekiler-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-icindekiler-tel:hover, .modulex-ust-icindekiler-posta:hover { color: --accentInk--; }
  .modulex-ust-icindekiler-dil:empty { display: none; }
  .modulex-ust-icindekiler-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-icindekiler-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-icindekiler-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-icindekiler--acik .modulex-ust-icindekiler-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-icindekiler--acik .modulex-ust-icindekiler-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-icindekiler--acik .modulex-ust-icindekiler-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-icindekiler-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-icindekiler-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-icindekiler-sol 0.3s ease both; }
  @keyframes modulex-ust-icindekiler-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-icindekiler-kapak { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 14px; }
  .modulex-ust-icindekiler-uc { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-icindekiler--js .modulex-ust-icindekiler-ac { display: inline-flex; }
  .modulex-ust-icindekiler--js .modulex-ust-icindekiler-nav--yedek { display: none; }
  .modulex-ust-icindekiler-nav--yedek .modulex-ust-icindekiler-liste { display: flex; flex-wrap: wrap; gap: 4px 22px; padding-block-end: 12px; }
  .modulex-ust-icindekiler .modulex-ust-icindekiler-fac { gap: 8px; padding-inline: 14px 8px; font-family: Georgia, "Times New Roman", serif; font-style: italic; transition: border-color 0.2s ease, background-color 0.2s ease; }
  .modulex-ust-icindekiler .modulex-ust-icindekiler-fac:hover, .modulex-ust-icindekiler--acik .modulex-ust-icindekiler-fac { border-color: --text--; background-color: --kartBg--; }
  .modulex-ust-icindekiler-rozet { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding-inline: 6px; border-radius: 999px; background-color: --text--; color: --bg--; font-family: var(--mx-font-sans, inherit); font-size: 0.75rem; font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-ust-icindekiler-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; z-index: 5; display: grid; gap: 18px; max-height: min(76vh, 640px); padding-block: 22px 24px; padding-inline: clamp(18px, 4vw, 44px); overflow-y: auto; border-block: 1px solid --text--; background-color: --bg--; box-shadow: 0 30px 50px -36px color-mix(in srgb, --text-- 65%, transparent); animation: modulex-ust-icindekiler-sayfa 0.35s ease both; }
  @keyframes modulex-ust-icindekiler-sayfa { from { opacity: 0; clip-path: inset(0 0 100% 0); } to { opacity: 1; clip-path: inset(0); } }
  .modulex-ust-icindekiler-fihrist { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 0 48px; }
  .modulex-ust-icindekiler-satir { border-block-end: 1px solid --cizgi--; }
  .modulex-ust-icindekiler-ioge { display: flex; align-items: baseline; gap: 12px; min-height: 48px; padding-block: 12px 10px; color: inherit; text-decoration: none; transition: color 0.2s ease; }
  .modulex-ust-icindekiler-ino { flex: none; min-width: 26px; color: --accentInk--; font-size: 0.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-ust-icindekiler-iad { font-family: Georgia, "Times New Roman", serif; font-size: 1.12rem; }
  .modulex-ust-icindekiler-kilavuz { flex: 1 1 auto; min-width: 20px; border-block-end: 2px dotted color-mix(in srgb, --text-- 30%, transparent); transform: translateY(-4px); transition: border-color 0.25s ease; }
  .modulex-ust-icindekiler-isayi { flex: none; color: --muted--; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .modulex-ust-icindekiler-ioge:hover { color: --accentInk--; }
  .modulex-ust-icindekiler-ioge:hover .modulex-ust-icindekiler-kilavuz { border-color: --accent--; }
  .modulex-ust-icindekiler-ioge[aria-current="page"] .modulex-ust-icindekiler-iad { font-style: italic; font-weight: 700; }
  .modulex-ust-icindekiler-ioge[aria-current="page"] .modulex-ust-icindekiler-kilavuz { border-block-end-style: solid; border-color: --accent--; }
  .modulex-ust-icindekiler-ialt { padding-block-end: 8px; padding-inline-start: 38px; }
  .modulex-ust-icindekiler-altsatir .modulex-ust-icindekiler-ioge { min-height: 40px; padding-block: 6px; }
  .modulex-ust-icindekiler-altsatir .modulex-ust-icindekiler-iad { font-size: 0.98rem; }
  .modulex-ust-icindekiler-palt { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block-start: 14px; border-block-start: 1px solid --cizgi--; }
  @media (max-width: 768px) {
    .modulex-ust-icindekiler--js .modulex-ust-icindekiler-uc > .modulex-ust-icindekiler-dil, .modulex-ust-icindekiler--js .modulex-ust-icindekiler-uc > .modulex-ust-icindekiler-cta { display: none; }
    .modulex-ust-icindekiler:not(.modulex-ust-icindekiler--js) .modulex-ust-icindekiler-kapak { flex-wrap: wrap; }
    .modulex-ust-icindekiler-ialt { padding-inline-start: 24px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-icindekiler :is(.modulex-ust-icindekiler-baslik, .modulex-ust-icindekiler-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-icindekiler-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-icindekiler { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-icindekiler *, .modulex-ust-icindekiler *::before, .modulex-ust-icindekiler *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-icindekiler";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
